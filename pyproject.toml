[project]
name = "sf-cdc"
version = "0.1.0"
description = "Snowflake Snowpipe + Streams + Tasks SCD2 pipeline, with SCD2 logic tested on DuckDB"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python>=3.10", "cryptography>=42"]
dev = ["pytest>=8", "ruff>=0.5", "duckdb>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
